<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Birthday Greeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* Gradient text effect */
        .gradient-text {
            background: linear-gradient(45deg, #ff6b9d, #ffd89b, #4facfe, #667eea);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Wobble animation */
        .wobble {
            animation: wobble 0.8s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: translateX(0) rotateZ(0deg); }
            25% { transform: translateX(-10px) rotateZ(-2deg); }
            75% { transform: translateX(10px) rotateZ(2deg); }
        }

        /* Pulse animation */
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Flip animation */
        .flip {
            animation: flip 1.5s ease-in-out infinite;
        }

        @keyframes flip {
            0%, 100% { transform: rotateX(0deg); }
            50% { transform: rotateX(360deg); }
        }

        /* Bounce animation */
        .bounce {
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        /* Rainbow colors */
        .rainbow {
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            0% { color: red; }
            16% { color: orange; }
            33% { color: yellow; }
            50% { color: green; }
            66% { color: blue; }
            83% { color: indigo; }
            100% { color: violet; }
        }

        /* Glow effect */
        .glow {
            text-shadow: 0 0 10px #ff6b9d, 0 0 20px #ffd89b, 0 0 30px #4facfe;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { 
                text-shadow: 0 0 10px #ff6b9d, 0 0 20px #ffd89b, 0 0 30px #4facfe;
            }
            50% { 
                text-shadow: 0 0 20px #ff6b9d, 0 0 40px #ffd89b, 0 0 60px #4facfe;
            }
        }

        .subtitle {
            font-size: 32px;
            margin-top: 30px;
            color: white;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Particles */
        .particle {
            position: absolute;
            pointer-events: none;
        }

        .particle span {
            display: inline-block;
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-50px) translateX(30px); }
        }

        .particle:nth-child(1) span { animation-delay: 0s; }
        .particle:nth-child(2) span { animation-delay: 0.3s; }
        .particle:nth-child(3) span { animation-delay: 0.6s; }
        .particle:nth-child(4) span { animation-delay: 0.9s; }
        .particle:nth-child(5) span { animation-delay: 1.2s; }

        @media (max-width: 768px) {
            h1 {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="particle" style="top: 20%; left: 10%;"><span>🎉</span></div>
    <div class="particle" style="top: 30%; right: 15%;"><span>🎂</span></div>
    <div class="particle" style="bottom: 25%; left: 20%;"><span>🎁</span></div>
    <div class="particle" style="bottom: 20%; right: 10%;"><span>✨</span></div>
    <div class="particle" style="top: 50%; right: 5%;"><span>💝</span></div>

    <div class="container">
        <h1 class="gradient-text wobble">
            ONAJON <br>TUG'ILGAN<br>KUNINGIZ<br>BILAN TABRIKLAYMAN!!!
        </h1>
        
        <div class="subtitle glow">
            Qimmatli onajonim baxtimga doimo sog'bo'ling! ❤️
        </div>
    </div>

    <script>
        // Optional: Click to trigger confetti
        document.addEventListener('click', () => {
            createConfetti();
        });

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.backgroundColor = ['#ff6b9d', '#ffd89b', '#4facfe', '#667eea'][Math.floor(Math.random() * 4)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '1000';
                document.body.appendChild(confetti);

                const vx = Math.random() * 8 - 4;
                const vy = Math.random() * 10 + 5;
                let x = parseFloat(confetti.style.left);
                let y = parseFloat(confetti.style.top);

                const fall = setInterval(() => {
                    x += vx;
                    y += vy;
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    confetti.style.opacity = 1 - (y / window.innerHeight);

                    if (y > window.innerHeight) {
                        clearInterval(fall);
                        confetti.remove();
                    }
                }, 20);
            }
        }

        // Auto-trigger confetti on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                createConfetti();
            }, 1000);
        });
    </script>
</body>
</html>
